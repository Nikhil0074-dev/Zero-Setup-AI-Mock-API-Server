<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero-Setup AI Mock API Server</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e6f7a'/%3E%3Cpath d='M8 11h16M8 16h10M8 21h13' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><span class="mark"></span><div><b>Mock API Server</b><small>describe it, then call it</small></div></div>
    <button class="btn primary wide" id="new-api" data-testid="new-api">New API</button>
    <div class="rail-title">Environments</div>
    <ul id="project-list" class="plist" data-testid="project-list"></ul>
    <div class="rail-title">Start from a template</div>
    <ul id="fixture-list" class="plist fixtures"></ul>
    <div class="rail-foot" id="provider-note">AI provider: <span id="provider-name">…</span></div>
  </aside>

  <main class="main" id="main"></main>
</div>
<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
